services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - /mnt/database/postgres:/var/lib/postgresql/data
    # Tuned for the host's actual 15GB RAM / NVMe SSD — stock image
    # defaults (shared_buffers=128MB, work_mem=4MB) were sized for a
    # tiny VM and left most of the available RAM unused as OS page
    # cache only. Values are moderate (not "dedicated DB server"
    # sizing) since this host also runs other unrelated services.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=8GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - /mnt/database/redis:/data
    command: redis-server --appendonly yes

  backend:
    build: ./backend
    container_name: backend
    restart: always
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://api.ioteratechnologies.com
    container_name: frontend
    restart: always
    ports:
      - "3000:80"
    volumes:
      - /mnt/apps/iot-platform/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
